[package]
name = "blame-engine-core"
description = "The Blame agent loop: turns, tool dispatch, context and recovery, written against ports with no I/O of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# In-memory fakes of every port, for this crate's tests and the binary's.
testing = []

[dependencies]
blame-engine-protocol.workspace = true
async-trait.workspace = true
futures-core.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Sync primitives and task spawning only: all waiting goes through the Clock
# port, so neither tokio's timer nor its I/O driver is needed.
tokio = { workspace = true, features = ["sync", "rt"] }
tokio-util.workspace = true

[dev-dependencies]
blame-engine-core = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

[lints]
workspace = true
