[package]
name = "blame-engine-providers"
description = "Model providers of the Blame agent engine, behind the core's ModelProvider port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A mock provider server for tests, this crate's and the binary's.
testing = ["tokio/rt"]

[dependencies]
blame-engine-core.workspace = true
blame-engine-protocol.workspace = true
async-trait.workspace = true
futures-core.workspace = true
serde.workspace = true
# `raw_value`: models.dev's catalog is cut to the served providers without
# parsing the other ~300.
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }

# Rig is pre-1.0 and breaks its API every few weeks: the exact version is
# pinned and nothing of it leaves this crate. `derive` (a proc macro for
# Rig's own tool trait) is off; `reqwest` gives the wires an HTTP transport.
rig-core = { version = "=0.46.0", default-features = false, features = ["reqwest", "rustls"] }
# The same reqwest Rig sends with, so the ChatGPT sign-in adds no second
# HTTP stack; also lets the registry build its own client (timeouts).
rig-reqwest = { version = "=0.46.0", default-features = false, features = ["rustls"] }
# The reqwest Rig sends with, with gzip for the models.dev catalog (6.8 MB
# raw, 0.7 MB gzipped). Provider clients turn it off (`no_gzip`).
reqwest = { version = "0.13", default-features = false, features = ["gzip"] }

# Already in the tree through rig-core; listed because this crate uses them
# directly.
async-stream = "0.3"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2.workspace = true
url = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
blame-engine-providers = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints]
workspace = true
