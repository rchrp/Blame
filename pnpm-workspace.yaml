packages:
  - "packages/*"
allowBuilds:
  "@ast-grep/lang-bash": true
  "@ast-grep/lang-c": true
  "@ast-grep/lang-cpp": true
  "@ast-grep/lang-csharp": true
  "@ast-grep/lang-go": true
  "@ast-grep/lang-java": true
  "@ast-grep/lang-python": true
  "@ast-grep/lang-rust": true
  "@swc/core": true
  electron: true
  electron-winstaller: true
  es5-ext: true
  esbuild: true
  msw: true
  node-pty: true
  pnpm: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  yarn: false

catalog:
  shiki: 4.5.0

overrides:
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # Electron 45 needs an ABI registry newer than rebuild's existing lock entry.
  "@electron/rebuild>node-abi": 4.40.0

patchedDependencies:
  '@cline/core@0.2.0': patches/@cline__core@0.2.0.patch
  sonner@2.0.8: patches/sonner@2.0.8.patch

