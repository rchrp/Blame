services:
  blame-volumes-init:
    image: node:22-bookworm-slim
    command: "sh -lc \"mkdir -p /tmp/corepack-cache /workspace/node_modules /pnpm/store && chown -R 0:0 /tmp/corepack-cache /workspace/node_modules /pnpm/store\""
    volumes:
      - "blame_corepack_cache:/tmp/corepack-cache"
      - "blame_node_modules:/workspace/node_modules"
      - "blame_pnpm_store:/pnpm/store"
  deps:
    image: "node:22-bookworm"
    working_dir: "/workspace"
    command: "sh -lc 'mkdir -p \"$$COREPACK_HOME/bin\" && corepack enable --install-directory \"$$COREPACK_HOME/bin\" && export PATH=\"$$COREPACK_HOME/bin:$$PATH\" && corepack prepare pnpm@10.33.2 --activate && corepack pnpm install --frozen-lockfile'"
    labels:
      blame.setup: "true"
    environment:
      COREPACK_HOME: "/tmp/corepack-cache"
      npm_config_store_dir: "/pnpm/store"
    depends_on:
      blame-volumes-init:
        condition: service_completed_successfully
    volumes:
      - "${BLAME_PROJECT_ROOT}:/workspace"
      - "blame_corepack_cache:/tmp/corepack-cache"
      - "blame_node_modules:/workspace/node_modules"
      - "blame_pnpm_store:/pnpm/store"
  prisma:
    image: "node:22-bookworm"
    working_dir: "/workspace"
    command: "sh -lc 'node -e '\\''const net=require(\"net\");const host=\"database\";const port=3306;const deadline=Date.now()+60000;function retry(){const socket=net.connect(port,host,()=>process.exit(0));socket.setTimeout(1000,()=>socket.destroy());socket.once(\"error\",next);socket.once(\"timeout\",next)};function next(){if(Date.now()>deadline)process.exit(1);setTimeout(retry,1000)};retry()'\\'' && pnpm prisma generate && pnpm prisma db push --skip-generate'"
    labels:
      blame.setup: "true"
    environment:
      COREPACK_HOME: "/tmp/corepack-cache"
      DATABASE_URL: "mysql://root:blame@database:3306/portfolio"
      npm_config_store_dir: "/pnpm/store"
    depends_on:
      blame-volumes-init:
        condition: service_completed_successfully
      deps:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    volumes:
      - "${BLAME_PROJECT_ROOT}:/workspace"
      - "blame_corepack_cache:/tmp/corepack-cache"
      - "blame_node_modules:/workspace/node_modules"
      - "blame_pnpm_store:/pnpm/store"
  database:
    image: "mysql:8.4"
    environment:
      COREPACK_HOME: "/tmp/corepack-cache"
      MYSQL_DATABASE: "portfolio"
      MYSQL_ROOT_PASSWORD: "blame"
      npm_config_store_dir: "/pnpm/store"
    labels:
      blame.service.id: "database"
      blame.service.kind: "dependency"
      blame.endpoint.0.id: "mysql"
      blame.endpoint.0.protocol: "tcp"
      blame.endpoint.0.port: "3306"
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    image: "node:22-bookworm"
    working_dir: "/workspace"
    command: "sh -lc 'node -e '\\''const net=require(\"net\");const host=\"database\";const port=3306;const deadline=Date.now()+60000;function retry(){const socket=net.connect(port,host,()=>process.exit(0));socket.setTimeout(1000,()=>socket.destroy());socket.once(\"error\",next);socket.once(\"timeout\",next)};function next(){if(Date.now()>deadline)process.exit(1);setTimeout(retry,1000)};retry()'\\'' && pnpm dev --webpack'"
    environment:
      COREPACK_HOME: "/tmp/corepack-cache"
      DATABASE_URL: "mysql://root:blame@database:3306/portfolio"
      HOST: "0.0.0.0"
      NEXTAUTH_SECRET: "development-only"
      NEXTAUTH_URL: "http://localhost:3000"
      npm_config_store_dir: "/pnpm/store"
      PORT: "3000"
    labels:
      blame.service.id: "web"
      blame.service.kind: "preview"
      blame.preview: "true"
      blame.preview.port: "3000"
      blame.preview.protocol: "http"
      blame.preview.path: "/"
      blame.endpoint.0.id: "http"
      blame.endpoint.0.protocol: "http"
      blame.endpoint.0.port: "3000"
    ports:
      - "127.0.0.1::3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e 'fetch(\"http://127.0.0.1:3000/\").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))'"
      interval: 5s
      timeout: 5s
      retries: 24
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - "${BLAME_PROJECT_ROOT}:/workspace"
      - "blame_corepack_cache:/tmp/corepack-cache"
      - "blame_node_modules:/workspace/node_modules"
      - "blame_pnpm_store:/pnpm/store"
volumes:
  blame_corepack_cache:
  blame_node_modules:
  blame_pnpm_store: