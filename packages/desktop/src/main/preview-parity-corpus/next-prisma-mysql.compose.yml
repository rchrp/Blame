name: blame_next_prisma_mysql
services:
  setup-deps:
    image: node:22-bookworm
    profiles:
      - setup
    command:
      - /bin/sh
      - -lc
      - mkdir -p "$$COREPACK_HOME/bin" && corepack enable --install-directory "$$COREPACK_HOME/bin" && export PATH="$$COREPACK_HOME/bin:$$PATH" && corepack prepare pnpm@10.33.2 --activate && corepack pnpm install --frozen-lockfile
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
      CI: "true"
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  setup-prisma:
    image: node:22-bookworm
    profiles:
      - setup
    command:
      - /bin/sh
      - -lc
      - (corepack enable 2>/dev/null || true) && corepack pnpm prisma generate && corepack pnpm prisma db push --skip-generate
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      DATABASE_URL: mysql://root:blame@database:3306/portfolio
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  database:
    image: mysql:8.4
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      MYSQL_DATABASE: portfolio
      MYSQL_ROOT_PASSWORD: blame
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
    ports:
      - 127.0.0.1:50000:3306
    volumes:
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --silent
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  web:
    image: node:22-bookworm
    command:
      - /bin/sh
      - -lc
      - (corepack enable 2>/dev/null || true) && corepack pnpm dev --webpack
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      DATABASE_URL: mysql://root:blame@database:3306/portfolio
      NEXTAUTH_SECRET: development-only
      NEXTAUTH_URL: http://localhost:3000
      HOST: 0.0.0.0
      PORT: "3000"
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:50001:3000
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const a=[];fetch("http://127.0.0.1:3000/",{signal:AbortSignal.timeout(4000)}).then(r=>process.exit((a.length?a.includes(r.status):r.status<500)?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
volumes:
  cache-blame_corepack_cache:
    name: blame_corepack_cache
    external: true
  cache-blame_node_modules:
    name: blame_node_modules_0123456789ab
    external: true
  cache-blame_pnpm_store:
    name: blame_pnpm_store
    external: true
