name: blame_django_postgres_redis
services:
  setup-migrate:
    image: python:3.13-bookworm
    profiles:
      - setup
    command:
      - /bin/sh
      - -lc
      - pip install -r requirements.txt && python manage.py migrate --noinput
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      DATABASE_URL: postgres://blame:blame@postgres:5432/app
      DJANGO_SECRET_KEY: development-only
      PIP_CACHE_DIR: /cache/pip
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_pip_cache:/cache/pip
    user: 1001:1001
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  postgres:
    image: postgres:17
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      POSTGRES_DB: app
      POSTGRES_PASSWORD: blame
      POSTGRES_USER: blame
      PIP_CACHE_DIR: /cache/pip
    ports:
      - 127.0.0.1:50000:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -q
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  redis:
    image: redis:7
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      PIP_CACHE_DIR: /cache/pip
    ports:
      - 127.0.0.1:50001:6379
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -h 127.0.0.1 ping || valkey-cli -h 127.0.0.1 ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  worker:
    image: python:3.13-bookworm
    command:
      - /bin/sh
      - -lc
      - celery -A app worker
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgres://blame:blame@postgres:5432/app
      DJANGO_SECRET_KEY: development-only
      PIP_CACHE_DIR: /cache/pip
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_pip_cache:/cache/pip
    user: 1001:1001
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  web:
    image: python:3.13-bookworm
    command:
      - /bin/sh
      - -lc
      - python manage.py runserver 0.0.0.0:8000
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      BROKER_URL: redis://redis:6379/0
      DATABASE_URL: postgres://blame:blame@postgres:5432/app
      DJANGO_SECRET_KEY: development-only
      HOST: 0.0.0.0
      PORT: "8000"
      PIP_CACHE_DIR: /cache/pip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:50002:8000
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_pip_cache:/cache/pip
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |-
          import sys,urllib.request,urllib.error
          accepted=[]
          url="http://127.0.0.1:8000/health/"
          timeout=4
          try:
           status=urllib.request.urlopen(url,timeout=timeout).status
          except urllib.error.HTTPError as error:
           status=error.code
          sys.exit(0 if (status in accepted if accepted else status < 500) else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
volumes:
  cache-blame_pip_cache:
    name: blame_pip_cache
    external: true
