name: blame_web_api_bindings
services:
  setup-deps:
    image: node:22-bookworm
    profiles:
      - setup
    command:
      - /bin/sh
      - -lc
      - mkdir -p "$$COREPACK_HOME/bin" && corepack enable --install-directory "$$COREPACK_HOME/bin" && export PATH="$$COREPACK_HOME/bin:$$PATH" && corepack prepare pnpm@10.33.2 --activate && corepack pnpm install
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
      CI: "true"
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  backend:
    image: node:22-bookworm
    command:
      - /bin/sh
      - -lc
      - node server.js
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      API_TOKEN: local
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
    ports:
      - 127.0.0.1:50000:3333
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const s=require("net").connect(3333,"127.0.0.1",()=>process.exit(0));s.once("error",()=>process.exit(1));s.setTimeout(4000,()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  web:
    image: node:22-bookworm
    command:
      - /bin/sh
      - -lc
      - mkdir -p "$$COREPACK_HOME/bin" && corepack enable --install-directory "$$COREPACK_HOME/bin" && export PATH="$$COREPACK_HOME/bin:$$PATH" && corepack prepare pnpm@10.33.2 --activate && corepack pnpm dev
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      HOST: 0.0.0.0
      PORT: "3000"
      COREPACK_HOME: /tmp/corepack-cache
      npm_config_store_dir: /pnpm/store
      SERVER_API_URL: http://backend:3333
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:50001:3000
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_corepack_cache:/tmp/corepack-cache
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_pnpm_store:/pnpm/store
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const a=[];fetch("http://127.0.0.1:3000/",{signal:AbortSignal.timeout(4000)}).then(r=>process.exit((a.length?a.includes(r.status):r.status<500)?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
volumes:
  cache-blame_corepack_cache:
    name: blame_corepack_cache
    external: true
  cache-blame_node_modules:
    name: blame_node_modules_0123456789ab
    external: true
  cache-blame_pnpm_store:
    name: blame_pnpm_store
    external: true
