name: blame_vite_api_browser_binding
services:
  setup-install:
    image: node:24-bookworm
    profiles:
      - setup
    command:
      - /bin/sh
      - -lc
      - npm ci
    working_dir: /workspace
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      NPM_CONFIG_CACHE: /npm/cache
      CI: "true"
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_npm_cache:/npm/cache
      - deps-api:/workspace/api/node_modules
      - deps-web:/workspace/web/node_modules
    user: 1001:1001
    restart: no
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  api:
    image: node:24-bookworm
    command:
      - /bin/sh
      - -lc
      - npm run dev
    working_dir: /workspace/api
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      PORT: "3333"
      SESSION_SECRET: dev
      HOST: 0.0.0.0
      NPM_CONFIG_CACHE: /npm/cache
    ports:
      - 127.0.0.1:50000:3333
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_npm_cache:/npm/cache
      - deps-api:/workspace/api/node_modules
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const a=[];fetch("http://127.0.0.1:3333/health",{signal:AbortSignal.timeout(4000)}).then(r=>process.exit((a.length?a.includes(r.status):r.status<500)?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
  frontend:
    image: node:24-bookworm
    command:
      - /bin/sh
      - -lc
      - npm run dev -- --host 0.0.0.0 --port 5173
    working_dir: /workspace/web
    environment:
      HOME: /tmp/blame-home
      XDG_CACHE_HOME: /tmp/blame-home/.cache
      HOST: 0.0.0.0
      PORT: "5173"
      NPM_CONFIG_CACHE: /npm/cache
      VITE_API_URL: http://localhost:50000
    ports:
      - 127.0.0.1:50001:5173
    volumes:
      - /home/blame/.local/share/blame/runtime/worktrees/story:/workspace
      - cache-blame_node_modules:/workspace/node_modules
      - cache-blame_npm_cache:/npm/cache
      - deps-web:/workspace/web/node_modules
    user: 1001:1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const a=[];fetch("http://127.0.0.1:5173/",{signal:AbortSignal.timeout(4000)}).then(r=>process.exit((a.length?a.includes(r.status):r.status<500)?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    restart: on-failure:3
    init: true
    stop_grace_period: 5s
    labels:
      blame.preview: "true"
volumes:
  cache-blame_node_modules:
    name: blame_node_modules_0123456789ab
    external: true
  cache-blame_npm_cache:
    name: blame_npm_cache
    external: true
  deps-api:
    name: blame_node_modules_0123456789ab_api
    external: true
  deps-web:
    name: blame_node_modules_0123456789ab_web
    external: true
