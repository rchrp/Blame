# Release scan exceptions for the sandbox runner image (scripts/sandbox-runner-release.mjs).
# Each entry is a critical finding with no fixed upstream build yet, scoped to the
# affected binary or package. Remove an entry as soon as a fixed release exists.
ignore:
  # HTTP/2 server flow control in golang.org/x/net (2026-10-08). Docker 29.9.2,
  # buildx 0.38.1 and Compose 5.6.1 are built with Go 1.26.10, but buildx,
  # Compose, containerd and runc (1.5.2 is the latest) still vendor
  # x/net 0.55-0.59. Remove each entry when its binary ships x/net >= 0.60.
  - vulnerability: GO-2026-6612
    reason: No fixed Docker, Compose or buildx build is available yet.
    package:
      location: /usr/local/lib/docker/cli-plugins/*
  - vulnerability: GO-2026-6612
    reason: No fixed Docker static build is available yet.
    package:
      location: /usr/local/bin/c*
  - vulnerability: GO-2026-6612
    reason: No runc release vendors a fixed x/net yet.
    package:
      location: /usr/local/bin/runc
  # os.Root junction traversal, Windows only; the image is Linux.
  - vulnerability: GO-2026-6604
    reason: Windows-only vulnerability in a Linux image.
    package:
      location: /usr/local/lib/docker/cli-plugins/*
  # simple-git unsafe-option guard bypasses. @cline/core pins simple-git 3.36.0
  # and imports its default export, which simple-git 4 removed, so the fix
  # cannot be overridden. Remove when Cline moves to simple-git >= 4.0.1.
  - vulnerability: GHSA-x6jw-m9v5-85vh
    reason: Pinned by @cline/core; simple-git 4 breaks Cline's import.
    package:
      name: simple-git
      location: /opt/blame/cline/**
  - vulnerability: GHSA-v5rq-49vh-5v5c
    reason: Pinned by @cline/core through simple-git 3.36.0.
    package:
      name: "@simple-git/argv-parser"
      location: /opt/blame/cline/**
