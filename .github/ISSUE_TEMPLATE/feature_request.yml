name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, [Discussions → Ideas](https://github.com/rchrp/Blame/discussions/categories/ideas) is a good place to start.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried or considered instead.
