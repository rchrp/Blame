# Opens (or refreshes) one pull request whenever npm has a newer Cline SDK.
# The pull request pins every @cline/* package, syncs the runtime manifests and
# bumps the runtime version. A maintainer reviews, merges and then releases.
# Blame's Cline patches are regenerated by their generator scripts; a patch that
# cannot be regenerated is removed and the pull request opens as a draft.
# A pull request that already carries maintainer commits is never overwritten:
# the workflow comments on it instead.
#
# Pull requests created with the default GITHUB_TOKEN do not trigger CI. Store a
# fine-grained token with "Contents" and "Pull requests" write access in the
# CLINE_SDK_UPDATE_TOKEN secret so CI runs on the pull request automatically.
name: Update Cline SDK

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cline-sdk-update

env:
  BRANCH: automation/cline-sdk

jobs:
  update:
    name: Check for a new Cline SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CLINE_SDK_UPDATE_TOKEN || github.token }}

      - uses: ./.github/actions/setup

      - id: check
        run: node scripts/cline-sdk-update.mjs check

      - id: pending
        if: steps.check.outputs.updated == 'true'
        name: Keep an open pull request that is current or edited by hand
        env:
          GH_TOKEN: ${{ secrets.CLINE_SDK_UPDATE_TOKEN || github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          title=$(gh pr list --head "$BRANCH" --state open --json title --jq '.[0].title // ""')
          if [[ "$title" == *"to $LATEST" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An open pull request already updates to $LATEST"
          elif [ -n "$title" ]; then
            git fetch --quiet origin "$BRANCH"
            authors=$(git log "origin/main..origin/$BRANCH" --format=%ae | grep -v "github-actions\[bot\]" || true)
            if [ -n "$authors" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              gh pr comment "$BRANCH" --body "Cline $LATEST is available. This pull request has maintainer commits, so it was not refreshed automatically: merge it first, or update it by hand with \`pnpm update:cline-sdk apply $LATEST\`."
            fi
          fi

      - id: apply
        if: steps.check.outputs.updated == 'true' && steps.pending.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          node scripts/cline-sdk-update.mjs apply "$LATEST"
          pnpm install --no-frozen-lockfile

      - id: patch
        if: steps.apply.outcome == 'success'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          STALE_PATCHES: ${{ steps.apply.outputs.stale_patches }}
        run: node scripts/cline-sdk-update.mjs patch "$LATEST"

      - name: Open or update the pull request
        if: steps.apply.outcome == 'success'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          GH_TOKEN: ${{ secrets.CLINE_SDK_UPDATE_TOKEN || github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
          STALE_PATCHES: ${{ steps.patch.outputs.stale_patches }}
        run: |
          # A partially failed patch-commit can still update patchedDependencies.
          # Always reconcile the lockfile before publishing the draft or PR.
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          title="chore(deps): update Cline SDK from $CURRENT to $LATEST"
          node scripts/cline-sdk-update.mjs notes "$CURRENT" "$LATEST" > "$RUNNER_TEMP/body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add --all
          git commit -m "$title"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            flags=(--head "$BRANCH" --base main --title "$title" --body-file "$RUNNER_TEMP/body.md")
            if [ -n "$STALE_PATCHES" ]; then
              flags+=(--draft)
            fi
            gh pr create "${flags[@]}"
          fi
