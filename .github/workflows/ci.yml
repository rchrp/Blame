name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-runtime:
    name: Windows PowerShell runtime tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/windows-runtime.test.mjs

  windows-workspaces:
    name: Windows workspace regressions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - run: pnpm --filter @blame/desktop build:workspace-dependencies
      - run: pnpm --filter @blame/desktop test:windows-workspaces

  line-budgets:
    name: Line budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-line-budgets.mjs

  agent-runtime:
    name: Agent runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node test events used as harness evidence require Node 24.
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      # Harness tests create and commit to throwaway repositories.
      - run: |
          git config --global user.name "Blame CI"
          git config --global user.email "ci@blame.invalid"
      # The runtime imports compiled workspace packages.
      - run: pnpm exec turbo run build --filter="@blame/agent-runtime^..."
      # Includes the Cline SDK smoke test that guards SDK upgrades.
      - run: pnpm --filter @blame/agent-runtime test

  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: 24
      - run: pnpm typecheck
      - run: pnpm --filter @blame/preview-contract test
      - run: pnpm --filter @blame/preview-runtime test
      - run: pnpm --filter @blame/sandbox-runner test
      - run: pnpm --filter @blame/preview-edge test
      - run: pnpm --filter @blame/app test
      - run: pnpm --filter @blame/desktop test
      - run: pnpm --filter @blame/desktop test:performance
      - run: pnpm --filter @blame/desktop build
      - run: pnpm test:semantic-harness-payload
      - run: node --test scripts/semantic-harness-install.test.mjs
      - run: pnpm test:release
      - run: pnpm --filter @blame/api build
      - run: pnpm --filter @blame/api exec node ace.js test --files='tests/unit/preview_runtime_security.spec.ts'
