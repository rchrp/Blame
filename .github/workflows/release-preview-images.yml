name: Release preview images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version, for example 0.1.0
        required: true
        type: string
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { kind: display, name: blame-preview-display }
          - { kind: node, name: blame-gui-node }
          - { kind: tauri, name: blame-gui-tauri }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: test "$(printf '%s' "$RELEASE_VERSION" | sed -n '/^[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*$/p')" = "$RELEASE_VERSION" && test -n "$RELEASE_VERSION"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/preview-images/${{ matrix.kind }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ inputs.version }}
      - name: Sign and record immutable image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > '${{ matrix.kind }}.image'
      - name: Collect notices and corresponding distribution sources
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sources
          docker run --rm -v "$PWD/sources:/sources" "$IMAGE@$DIGEST" sh -ec '
            cp -a /usr/share/doc /sources/notices
            dpkg-query -W > /sources/packages.txt
            sed -i "s/Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/debian.sources
            apt-get update
            cd /sources
            dpkg-query -W -f="\${source:Package}=\${source:Version}\n" | sort -u > source-packages.txt
            while IFS= read -r package; do apt-get source --download-only "$package"; done < source-packages.txt
          '
          tar -czf '${{ matrix.kind }}-sources.tar.gz' sources
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.kind }}-${{ inputs.version }}
          retention-days: 90
          path: |
            ${{ matrix.kind }}.image
            ${{ matrix.kind }}-sources.tar.gz

      - name: Preserve source offer in the permanent release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          release="preview-images-v$RELEASE_VERSION"
          gh release view "$release" >/dev/null 2>&1 || gh release create "$release" --target "$GITHUB_SHA" --title "Preview images $RELEASE_VERSION" --notes "Signed GUI images, immutable pins, license notices and corresponding distribution sources." || gh release view "$release"
          gh release upload "$release" '${{ matrix.kind }}.image' '${{ matrix.kind }}-sources.tar.gz' --clobber
