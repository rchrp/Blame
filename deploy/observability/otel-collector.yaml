extensions:
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
    timeout: 10s
    fsync: true
    compaction:
      on_start: true
      directory: /var/lib/otelcol/compaction
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:BLAME_OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:BLAME_OTEL_MEMORY_SPIKE_LIMIT_MIB}

  filter/metrics_cardinality:
    error_mode: ignore
    metric_conditions:
      - 'datapoint.attributes["session.id"] != nil'
      - 'datapoint.attributes["user.id"] != nil'
      - 'datapoint.attributes["enduser.id"] != nil'
      - 'datapoint.attributes["file.path"] != nil'
      - 'datapoint.attributes["code.file.path"] != nil'
      - 'datapoint.attributes["error.message"] != nil'
      - 'datapoint.attributes["exception.message"] != nil'
      - 'resource.attributes["session.id"] != nil'
      - 'resource.attributes["user.id"] != nil'
      - 'resource.attributes["enduser.id"] != nil'
      - 'resource.attributes["file.path"] != nil'
      - 'resource.attributes["code.file.path"] != nil'
      - 'resource.attributes["error.message"] != nil'
      - 'resource.attributes["exception.message"] != nil'

  redaction/traces:
    allow_all_keys: false
    allowed_keys: &detailed_allowed_keys
      - service.name
      - service.namespace
      - service.version
      - service.instance.id
      - deployment.environment.name
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
      - cloud.region
      - host.arch
      - os.type
      - process.runtime.name
      - process.runtime.version
      - http.request.method
      - http.response.status_code
      - http.route
      - http.request.body.size
      - http.response.body.size
      - http.request.resend_count
      - http.method
      - http.status_code
      - server.address
      - server.port
      - net.peer.name
      - net.peer.port
      - network.protocol.name
      - network.protocol.version
      - network.transport
      - url.scheme
      - db.system.name
      - db.operation.name
      - db.response.status_code
      - db.system
      - error.type
      - exception.type
      - exception.escaped
      - event.name
    redact_all_types: true
    blocked_key_patterns: &blocked_key_patterns
      - "(?i).*authorization.*"
      - "(?i).*api[._-]?key.*"
      - "(?i).*access[._-]?token.*"
      - "(?i).*refresh[._-]?token.*"
      - "(?i).*password.*"
      - "(?i).*secret.*"
      - "(?i).*credential.*"
      - "(?i).*cookie.*"
      - "(?i)(?:^|.*[._-])request[._-]?body$"
      - "(?i)(?:^|.*[._-])response[._-]?body$"
    blocked_values: &blocked_values
      - '(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+'
      - '\bsk-[A-Za-z0-9_-]{12,}\b'
      - '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
      - '\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
      - '(?i)\b(?:api[_-]?key|access[_-]?token|authorization|password|refresh[_-]?token|secret|token)\s*[=:]\s*[^\s,;]+'
      - '(?i)[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
    summary: silent
    url_sanitizer: &url_sanitizer
      enabled: true
      attributes:
        - http.url
        - url.full
      sanitize_span_name: true
    db_sanitizer: &db_sanitizer
      sanitize_span_name: true
      sql:
        enabled: true
        attributes:
          - db.statement
          - db.query.text

  redaction/logs:
    allow_all_keys: false
    allowed_keys: *detailed_allowed_keys
    redact_all_types: true
    blocked_key_patterns: *blocked_key_patterns
    blocked_values: *blocked_values
    summary: silent
    url_sanitizer: *url_sanitizer
    db_sanitizer: *db_sanitizer

  redaction/metrics:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.namespace
      - service.version
      - deployment.environment.name
      - telemetry.sdk.name
      - telemetry.sdk.language
      - telemetry.sdk.version
      - cloud.region
      - host.arch
      - os.type
      - process.runtime.name
      - process.runtime.version
      - http.request.method
      - http.response.status_code
      - http.route
      - http.method
      - http.status_code
      - server.address
      - server.port
      - network.protocol.version
      - url.scheme
      - db.system.name
      - db.operation.name
      - db.system
      - error.type
      - blame.operation.status
      - blame.runtime.name
      - blame.runtime.phase
    redact_all_types: true
    blocked_key_patterns: *blocked_key_patterns
    blocked_values: *blocked_values
    summary: silent
    url_sanitizer: *url_sanitizer
    db_sanitizer: *db_sanitizer

  transform/traces:
    error_mode: ignore
    trace_statements:
      - 'keep_matching_keys(resource.attributes, "^(service\\.(name|namespace|version|instance\\.id)|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|cloud\\.region|host\\.arch|os\\.type|process\\.runtime\\.(name|version))$")'
      - 'set(span.attributes["http.request.method"], span.attributes["http.method"]) where span.attributes["http.request.method"] == nil and span.attributes["http.method"] != nil'
      - 'delete_key(span.attributes, "http.method")'
      - 'set(span.attributes["http.response.status_code"], span.attributes["http.status_code"]) where span.attributes["http.response.status_code"] == nil and span.attributes["http.status_code"] != nil'
      - 'delete_key(span.attributes, "http.status_code")'
      - 'set(span.attributes["db.system.name"], span.attributes["db.system"]) where span.attributes["db.system.name"] == nil and span.attributes["db.system"] != nil'
      - 'delete_key(span.attributes, "db.system")'
      - 'set(span.attributes["server.address"], span.attributes["net.peer.name"]) where span.attributes["server.address"] == nil and span.attributes["net.peer.name"] != nil'
      - 'delete_key(span.attributes, "net.peer.name")'
      - 'set(span.attributes["server.port"], span.attributes["net.peer.port"]) where span.attributes["server.port"] == nil and span.attributes["net.peer.port"] != nil'
      - 'delete_key(span.attributes, "net.peer.port")'

  transform/logs:
    error_mode: ignore
    log_statements:
      - 'keep_matching_keys(resource.attributes, "^(service\\.(name|namespace|version|instance\\.id)|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|cloud\\.region|host\\.arch|os\\.type|process\\.runtime\\.(name|version))$")'
      - 'set(log.attributes["http.request.method"], log.attributes["http.method"]) where log.attributes["http.request.method"] == nil and log.attributes["http.method"] != nil'
      - 'delete_key(log.attributes, "http.method")'
      - 'set(log.attributes["http.response.status_code"], log.attributes["http.status_code"]) where log.attributes["http.response.status_code"] == nil and log.attributes["http.status_code"] != nil'
      - 'delete_key(log.attributes, "http.status_code")'
      - 'replace_pattern(log.body, "(?i)Bearer\\s+[A-Za-z0-9._~+/=-]+", "[REDACTED]")'
      - 'replace_pattern(log.body, "\\bsk-[A-Za-z0-9_-]{12,}\\b", "[REDACTED]")'
      - 'replace_pattern(log.body, "\\bgh[pousr]_[A-Za-z0-9]{20,}\\b", "[REDACTED]")'
      - 'replace_pattern(log.body, "\\bgithub_pat_[A-Za-z0-9_]{20,}\\b", "[REDACTED]")'
      - 'replace_pattern(log.body, "\\beyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\b", "[REDACTED]")'
      - 'replace_pattern(log.body, "(?i)\\b(api[_-]?key|access[_-]?token|authorization|password|refresh[_-]?token|secret|token)\\s*[=:]\\s*[^\\s,;]+", "$1=[REDACTED]")'
      - "set(log.body, log.event_name) where log.event_name != nil"

  transform/metrics:
    error_mode: ignore
    metric_statements:
      - 'keep_matching_keys(resource.attributes, "^(service\\.(name|namespace|version)|deployment\\.environment\\.name|telemetry\\.sdk\\.(name|language|version)|cloud\\.region|host\\.arch|os\\.type|process\\.runtime\\.(name|version))$")'
      - 'set(datapoint.attributes["http.request.method"], datapoint.attributes["http.method"]) where datapoint.attributes["http.request.method"] == nil and datapoint.attributes["http.method"] != nil'
      - 'delete_key(datapoint.attributes, "http.method")'
      - 'set(datapoint.attributes["http.response.status_code"], datapoint.attributes["http.status_code"]) where datapoint.attributes["http.response.status_code"] == nil and datapoint.attributes["http.status_code"] != nil'
      - 'delete_key(datapoint.attributes, "http.status_code")'
      - 'set(datapoint.attributes["db.system.name"], datapoint.attributes["db.system"]) where datapoint.attributes["db.system.name"] == nil and datapoint.attributes["db.system"] != nil'
      - 'delete_key(datapoint.attributes, "db.system")'

  attributes/detailed_safety:
    actions: &content_deletions
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: code.file.path
        action: delete

  attributes/metrics_safety:
    actions:
      - key: session.id
        action: delete
      - key: user.id
        action: delete
      - key: enduser.id
        action: delete
      - key: file.path
        action: delete
      - key: error.message
        action: delete
      - key: exception.message
        action: delete
      - key: authorization
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: db.statement
        action: delete
      - key: db.query.text
        action: delete
      - key: code.file.path
        action: delete

  filter/traces:
    error_mode: ignore
    trace_conditions:
      - 'span.attributes["http.route"] == "/health"'
      - 'span.attributes["http.route"] == "/healthz"'
      - 'span.attributes["http.route"] == "/ready"'
      - 'span.attributes["http.route"] == "/readyz"'

  filter/logs:
    error_mode: ignore
    log_conditions:
      - 'log.event_name == nil or not IsMatch(log.event_name, "^blame\\.[A-Za-z0-9_.-]+$")'
      - 'log.attributes["http.route"] == "/health"'
      - 'log.attributes["http.route"] == "/healthz"'
      - 'log.attributes["http.route"] == "/ready"'
      - 'log.attributes["http.route"] == "/readyz"'

  tail_sampling:
    sampling_strategy: trace-complete
    decision_wait: ${env:BLAME_OTEL_TAIL_DECISION_WAIT}
    decision_wait_after_root_received: ${env:BLAME_OTEL_TAIL_ROOT_GRACE_PERIOD}
    num_traces: ${env:BLAME_OTEL_TAIL_NUM_TRACES}
    expected_new_traces_per_sec: ${env:BLAME_OTEL_EXPECTED_NEW_TRACES_PER_SEC}
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes:
            - ERROR
      - name: semantic-errors
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'span.attributes["error.type"] != nil'
            - 'span.attributes["http.response.status_code"] != nil and span.attributes["http.response.status_code"] >= 500'
      - name: slow
        type: latency
        latency:
          threshold_ms: ${env:BLAME_OTEL_SLOW_TRACE_THRESHOLD_MS}
      - name: rollout
        type: and
        and:
          and_sub_policy:
            - name: rollout-version
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and resource.attributes["service.version"] == "${env:BLAME_OTEL_ROLLOUT_VERSION}"'
            - name: rollout-probability
              type: probabilistic
              probabilistic:
                hash_salt: blame-rollout
                sampling_percentage: ${env:BLAME_OTEL_ROLLOUT_SAMPLING_PERCENTAGE}
      - name: normal
        type: and
        and:
          and_sub_policy:
            - name: non-rollout-version
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'IsRootSpan() and resource.attributes["service.version"] != "${env:BLAME_OTEL_ROLLOUT_VERSION}"'
            - name: normal-probability
              type: probabilistic
              probabilistic:
                hash_salt: blame-normal
                sampling_percentage: ${env:BLAME_OTEL_NORMAL_SAMPLING_PERCENTAGE}

  batch:
    send_batch_size: 1024
    send_batch_max_size: 2048
    timeout: 5s

exporters:
  otlp_grpc/backend:
    endpoint: ${env:BLAME_OTEL_BACKEND_ENDPOINT}
    headers:
      authorization: ${env:BLAME_OTEL_BACKEND_AUTHORIZATION}
    compression: gzip
    timeout: 10s
    tls:
      insecure: ${env:BLAME_OTEL_BACKEND_INSECURE}
      insecure_skip_verify: false
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      num_consumers: 10
      queue_size: 5000

service:
  extensions:
    - file_storage
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - redaction/traces
        - transform/traces
        - attributes/detailed_safety
        - filter/traces
        - tail_sampling
        - batch
      exporters:
        - otlp_grpc/backend
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/metrics_cardinality
        - redaction/metrics
        - transform/metrics
        - attributes/metrics_safety
        - batch
      exporters:
        - otlp_grpc/backend
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - redaction/logs
        - transform/logs
        - attributes/detailed_safety
        - filter/logs
        - batch
      exporters:
        - otlp_grpc/backend
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
    logs:
      level: info
      encoding: json
      output_paths:
        - stdout
      error_output_paths:
        - stderr
