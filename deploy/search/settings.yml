use_default_settings:
  engines:
    keep_only: [google, duckduckgo, brave]
server:
  secret_key: "@SEARXNG_SECRET@"
  limiter: false
  public_instance: false
search:
  formats: [json]
  safe_search: 0
outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
